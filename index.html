<style id="site-css">
:root{
  --ground:#0F1B2D; --ink:#E8EDF6; --muted:#A3B1C7; --accent:#63CDBB; --accent-ink:#0B1A26;
  --panel:rgba(15,27,45,.8); --panel-edge:rgba(232,237,246,.08); --toolbar:#13223A; --dialog:#16263F; --field:#0F1B2D;
  --rule:rgba(232,237,246,.12); --rule-strong:rgba(232,237,246,.3);
  --chip:rgba(99,205,187,.12); --chip-ink:#A8E8DD;
  --teal-rgb:99,205,187; --blue-rgb:147,169,255; --ground-rgb:15,27,45;
  --focus:#63CDBB; --danger:#FF9B8F;
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible','Segoe UI',system-ui,-apple-system,sans-serif;
  --wrap:min(68rem,calc(100% - 2.5rem));
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--ground);scroll-padding-top:calc(env(safe-area-inset-top,0px) + 4.5rem);scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.6;-webkit-text-size-adjust:100%;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:rgba(15,27,45,.85)}
body.editing::before{background:var(--toolbar)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
#app{position:relative;z-index:1}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px}
img{max-width:100%}

/* soft light that drifts very slowly */
.glows{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.glow{position:absolute;border-radius:50%;will-change:transform}
.glow-a{width:80vmax;height:80vmax;left:-28vmax;top:-30vmax;background:radial-gradient(circle,rgba(var(--teal-rgb),.24) 0%,rgba(var(--teal-rgb),.09) 40%,rgba(var(--teal-rgb),0) 68%)}
.glow-b{width:70vmax;height:70vmax;right:-26vmax;bottom:-28vmax;background:radial-gradient(circle,rgba(var(--blue-rgb),.2) 0%,rgba(var(--blue-rgb),.07) 40%,rgba(var(--blue-rgb),0) 68%)}
.glow-c{width:50vmax;height:50vmax;right:-8vmax;top:30vh;background:radial-gradient(circle,rgba(var(--teal-rgb),.13) 0%,rgba(var(--blue-rgb),.06) 45%,rgba(var(--blue-rgb),0) 68%)}

/* top bar */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(15,27,45,.85);border-bottom:1px solid var(--panel-edge)}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .nav,body:not(.editing)::before{background:rgba(15,27,45,.66);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
}
.nav-in{width:var(--wrap);margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem;min-height:3.75rem}
.brand{font-family:var(--display);font-weight:700;font-size:1.15rem;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;min-height:44px}
.nav-links{display:flex;gap:clamp(.8rem,3vw,1.75rem);list-style:none;margin:0;padding:0}
.nav-links a{display:inline-flex;align-items:center;min-height:44px;color:var(--ink);text-decoration:none;font-weight:700;font-size:.95rem;opacity:.85}
.nav-links a:hover{opacity:1;color:var(--accent)}
@media (max-width:520px){.hide-sm{display:none}}

/* hero */
.hero{width:var(--wrap);margin:0 auto;padding:clamp(3.5rem,12vh,8rem) 0 1rem;display:grid;gap:2.5rem;align-items:center}
@media (min-width:860px){.hero.has-photo{grid-template-columns:1.35fr .65fr}}
.hello{font-family:var(--display);font-weight:600;font-size:clamp(1.5rem,4.5vw,2.25rem);color:var(--accent);margin:0}
.hi{font-family:var(--display);font-weight:700;font-size:clamp(3.2rem,13vw,7rem);line-height:.95;letter-spacing:-.035em;margin:.08em 0 .45em;overflow-wrap:anywhere}
.headline{font-family:var(--display);font-weight:500;font-size:clamp(1.15rem,3.2vw,1.5rem);line-height:1.4;max-width:34ch;margin:0 0 1rem}
.lede{margin:0 0 1.75rem}
.lede p{max-width:38rem;color:var(--muted);margin:0 0 .9rem;font-size:1.08rem}
.where{color:var(--muted);font-size:.95rem;margin:1.25rem 0 0}
.hero-photo{margin:0}
.hero-photo img{display:block;width:100%;max-width:21rem;aspect-ratio:4/5;object-fit:cover;border-radius:28px;border:1px solid var(--panel-edge);box-shadow:0 30px 80px rgba(0,0,0,.35)}
@media (max-width:859px){.hero-photo{order:-1}.hero-photo img{max-width:11rem;aspect-ratio:1;border-radius:24px}}
.actions{display:flex;flex-wrap:wrap;gap:.75rem}
.actions.center{justify-content:center}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:.6rem 1.2rem;border-radius:999px;border:1.5px solid var(--rule-strong);color:var(--ink);background:transparent;font:700 1rem/1.2 var(--body);text-decoration:none;cursor:pointer;transition:transform .2s ease,background-color .2s ease,filter .2s ease}
.btn.ghost{background:rgba(15,27,45,.6)}
.btn:hover{background:rgba(232,237,246,.07);transform:translateY(-1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none;transform:none}
.btn.danger{color:var(--danger);border-color:var(--danger);margin-right:auto}

/* sections */
.sec{width:var(--wrap);margin:0 auto;padding:clamp(4rem,10vw,6.5rem) 0 0}
.sec-head{max-width:44rem;margin:0 0 2.25rem}
.sec-head h2{font-family:var(--display);font-weight:700;font-size:clamp(2.1rem,6.5vw,3.25rem);line-height:1.05;letter-spacing:-.025em;margin:0 0 .6rem}
.note{color:var(--muted);margin:0;font-size:1rem;max-width:42rem}
.empty{color:var(--muted)}

/* work showcase */
.work-list{display:grid;gap:clamp(3rem,8vw,5.5rem)}
.work-card{display:grid;gap:1.5rem;align-items:center}
@media (min-width:860px){
  .work-card{grid-template-columns:1.15fr 1fr;gap:3rem}
  .work-card.flip > :first-child{order:2}
}
.cover-link{display:block;border-radius:24px;text-decoration:none}
.cover{position:relative;aspect-ratio:16/11;border-radius:24px;overflow:hidden;border:1px solid var(--panel-edge);transition:transform .6s cubic-bezier(.25,.8,.25,1)}
.cover-link:hover .cover{transform:scale(1.015)}
.cover img{display:block;width:100%;height:100%;object-fit:cover}
.cover-art{position:absolute;inset:0}
.cover-art svg{display:block;width:100%;height:100%}
.cover.t0{background:radial-gradient(120% 90% at 0% 0%,rgba(99,205,187,.55),rgba(99,205,187,0) 60%),radial-gradient(90% 80% at 100% 100%,rgba(147,169,255,.3),rgba(147,169,255,0) 60%),#13253A}
.cover.t1{background:radial-gradient(120% 90% at 100% 0%,rgba(147,169,255,.5),rgba(147,169,255,0) 60%),radial-gradient(90% 80% at 0% 100%,rgba(99,205,187,.25),rgba(99,205,187,0) 60%),#141F3D}
.cover.t2{background:radial-gradient(120% 90% at 0% 100%,rgba(179,157,255,.45),rgba(179,157,255,0) 60%),radial-gradient(90% 80% at 100% 0%,rgba(99,205,187,.22),rgba(99,205,187,0) 60%),#1A1B3A}
.cover.t3{background:radial-gradient(120% 90% at 100% 100%,rgba(242,165,184,.38),rgba(242,165,184,0) 60%),radial-gradient(90% 80% at 0% 0%,rgba(147,169,255,.25),rgba(147,169,255,0) 60%),#1F1E38}
.cover-kind{position:absolute;left:1.25rem;top:1.1rem;font-size:.9rem;font-weight:700;color:rgba(255,255,255,.82)}
.cover-num{position:absolute;right:1.1rem;bottom:-.1em;font-family:var(--display);font-weight:800;font-size:clamp(5rem,18vw,9.5rem);line-height:1;letter-spacing:-.04em;color:rgba(255,255,255,.17)}
.work-num{font-family:var(--display);font-weight:700;color:var(--accent);margin:0 0 .25rem}
.work-body h3{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,4.5vw,2.25rem);line-height:1.15;letter-spacing:-.015em;margin:0 0 .6rem}
.work-body > p{margin:0 0 .8rem;max-width:36rem}
.more{display:inline-flex;align-items:center;min-height:44px;margin-top:.5rem;font-weight:700;text-decoration:underline;text-underline-offset:.2em}
.chips{list-style:none;padding:0;margin:.5rem 0 0;display:flex;flex-wrap:wrap;gap:.4rem}
.chips li{background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:.2rem .75rem;font-size:.9rem}
.meta{display:flex;flex-wrap:wrap;gap:.1rem 1rem;color:var(--muted);font-size:.95rem;margin:0 0 .5rem}
.status-tag{display:inline-block;padding:.05rem .65rem;border-radius:999px;border:1px solid var(--rule-strong);color:var(--ink);font-size:.85rem}

/* skills */
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(17rem,1fr));gap:1rem}
.group{padding:1.4rem 1.4rem 1.5rem;border-radius:20px;border:1px solid var(--rule);background:rgba(15,27,45,.55)}
.group h3{font-family:var(--display);font-weight:600;font-size:1.2rem;line-height:1.25;margin:0 0 .4rem}
.group h3::before{content:"";display:inline-block;width:.5em;height:.5em;margin-right:.6em;vertical-align:.1em;transform:rotate(45deg);background:rgb(var(--blue-rgb))}
.group.tone-a h3::before{background:rgb(var(--teal-rgb))}
.group.tone-b .chips li{background:rgba(var(--blue-rgb),.13);color:#C6D1FF}
.group-note{color:var(--muted);font-size:.95rem;margin:0 0 .75rem}
.langs{margin:1.25rem 0 0;color:var(--muted)}

/* experience */
.xp-list{display:grid}
.xp{display:grid;gap:.4rem 2.5rem;padding:1.75rem 0;border-top:1px solid var(--rule)}
@media (min-width:760px){.xp{grid-template-columns:12rem 1fr}}
.xp-dates{margin:0;color:var(--muted);font-size:.95rem}
.xp-org{margin:.15rem 0 0;font-weight:700}
.xp-what h3{font-family:var(--display);font-weight:600;font-size:1.35rem;line-height:1.25;margin:0 0 .4rem}
.xp-what > p{margin:0 0 .6rem;max-width:40rem}
.highlight{margin:.85rem 0 .35rem;padding:1.1rem 1.2rem 1.2rem;border-radius:16px;background:rgba(var(--teal-rgb),.07);border:1px solid rgba(var(--teal-rgb),.24);max-width:40rem}
.highlight h4{font-family:var(--display);font-weight:600;font-size:1.05rem;line-height:1.3;margin:0 0 .4rem}
.highlight h4::before{content:"";display:inline-block;width:.5em;height:.5em;margin-right:.6em;vertical-align:.1em;transform:rotate(45deg);background:rgb(var(--teal-rgb))}
.highlight p{margin:0 0 .5rem}
.meter{margin:.8rem 0 .7rem}
.meter .meter-label{margin:0 0 .4rem;font-weight:700;font-size:.95rem}
.meter-track{position:relative;height:10px;border-radius:999px;background:rgba(232,237,246,.09);overflow:hidden}
.meter-fill{position:absolute;left:0;top:0;bottom:0;width:var(--to);border-radius:inherit;background:linear-gradient(90deg,rgba(var(--teal-rgb),.45),rgb(var(--teal-rgb)))}
.reveal:not(.in) .meter-fill{width:var(--from)}
.reveal.in .meter-fill{transition:width 1.6s cubic-bezier(.2,.8,.2,1) calc(var(--d,0ms) + .5s)}
.meter .meter-legend{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.25rem 1rem;margin:.4rem 0 0;color:var(--muted);font-size:.9rem}

/* education */
.learn{list-style:none;padding:0;margin:0;display:grid;gap:0 2.5rem}
@media (min-width:760px){.learn{grid-template-columns:1fr 1fr}}
.learn li{padding:1rem 0;border-top:1px solid var(--rule)}
.learn .t{display:block;font-weight:700}
.learn .meta{margin:0}
.sims{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1rem}
.sim{padding:1.35rem 1.4rem 1.4rem;border-radius:20px;border:1px solid var(--rule);background:rgba(15,27,45,.55)}
.sim-org{margin:0 0 .2rem;font-family:var(--display);font-weight:700;font-size:.95rem;color:var(--accent)}
.sim h3{font-family:var(--display);font-weight:600;font-size:1.25rem;line-height:1.25;margin:0 0 .35rem}
.sim-meta{margin:0;color:var(--muted);font-size:.92rem}
.sim-sum{margin:.6rem 0 0}
.sim{display:flex;flex-direction:column}
.sim h3 a{color:var(--ink);text-decoration:none}
.sim h3 a:hover{color:var(--accent)}
.sim .more{margin-top:auto;padding-top:.6rem}
.sim-tasks{list-style:none;margin:0;padding:0;display:grid;gap:1rem;counter-reset:t}
.sim-task{display:grid;grid-template-columns:2.6rem 1fr;gap:1rem;padding:1.25rem 1.4rem 1.35rem;border-radius:18px;border:1px solid var(--rule);background:rgba(15,27,45,.55);counter-increment:t}
.sim-task::before{content:counter(t);display:inline-flex;align-items:center;justify-content:center;width:2.6rem;height:2.6rem;border-radius:50%;background:var(--chip);color:var(--accent);font-family:var(--display);font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums}
.sim-task > div{min-width:0}
.sim-task h3{font-family:var(--display);font-weight:600;font-size:1.2rem;line-height:1.3;margin:.35rem 0 .35rem}
.sim-task p{margin:0;max-width:44rem}
.sim-task .chips{margin-top:.7rem}
@media (max-width:560px){.nav-in{gap:.25rem .75rem;padding-block:.35rem}.brand{font-size:1rem}.nav-links{gap:.85rem}.nav-links a{font-size:.9rem}}
.cv-wrap{width:min(52rem,calc(100% - 1.5rem));margin:0 auto;padding:1.75rem 0 1rem}
.cv-top{display:flex;flex-wrap:wrap;gap:.75rem;justify-content:space-between;align-items:center;margin:0 0 1.25rem}
.paper{background:#FFFFFF;color:#1B2333;border-radius:14px;padding:clamp(1.5rem,6vw,3.25rem) clamp(1.25rem,6vw,3.5rem);box-shadow:0 30px 80px rgba(0,0,0,.4);font-size:1rem;line-height:1.55}
.paper a{color:#1F6F63}
.cv-pages{display:grid;gap:1.25rem}
.cv-page{display:block;width:100%;padding:0;border:0;margin:0;background:#FFFFFF;border-radius:6px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.4);cursor:zoom-in}
.cv-page img{display:block;width:100%;height:auto}
.cv-page:focus-visible{outline:3px solid var(--accent,#3FB59E);outline-offset:4px}
.cv-name{font-family:var(--display);font-weight:700;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1;letter-spacing:-.02em;text-align:center;color:#111827;margin:0 0 .5rem}
.cv-contact{display:flex;flex-wrap:wrap;justify-content:center;margin:0 0 1.6rem;font-size:.95rem;color:#3F4A5E;text-align:center}
.cv-bit{overflow-wrap:anywhere}
.cv-bit + .cv-bit::before{content:'|';margin:0 .6rem;color:#9AA3B2}
.cv-sec{margin:0 0 1.4rem}
.cv-sec h2{font-family:var(--display);font-weight:700;font-size:1.05rem;color:#111827;margin:0 0 .6rem;padding-bottom:.3rem;border-bottom:1.5px solid #1F6F63}
.cv-sec > p{margin:.3rem 0 0}
.cv-item{margin:0 0 .9rem}
.cv-item p{margin:.25rem 0 0}
.cv-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.1rem 1rem}
.cv-when{color:#4A556B;font-size:.93rem}
.paper .tool{color:#1F6F63;border-color:#1F6F63}
.paper .tool:hover{background:rgba(31,111,99,.08)}
@media (prefers-reduced-motion: no-preference){.paper{animation:fadeUp .6s ease-out backwards}}

/* contact */
.contact-big{text-align:center}
.contact-big h2{font-family:var(--display);font-weight:700;font-size:clamp(2.6rem,10vw,5rem);line-height:1;letter-spacing:-.03em;margin:0 0 .9rem}
.contact-big .note{margin:0 auto 1.5rem;max-width:34rem}
.big-mail{display:inline-block;font-family:var(--display);font-weight:600;font-size:clamp(1.25rem,5.5vw,2.4rem);color:var(--ink);text-decoration:underline;text-decoration-color:rgba(var(--teal-rgb),.6);text-decoration-thickness:2px;text-underline-offset:.2em;overflow-wrap:anywhere;margin:0 0 1.75rem}
.big-mail:hover{color:var(--accent)}
.contact-big .tools{justify-content:center}
.foot{width:var(--wrap);margin:4.5rem auto 0;padding:1.5rem 0 2.5rem;border-top:1px solid var(--rule);color:var(--muted);font-size:.9rem;display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5rem 1.5rem}
body.can-edit .foot{padding-bottom:6.5rem}

/* gentle entrances */
.reveal{opacity:0;transform:translateY(12px);transition:opacity .7s ease var(--d,0ms),transform .7s cubic-bezier(.25,.8,.25,1) var(--d,0ms)}
.reveal.in{opacity:1;transform:none}
.reveal .chips li{opacity:0;transition:opacity .5s ease;transition-delay:calc(var(--d,0ms) + 200ms + var(--c,0) * 30ms)}
.reveal.in .chips li{opacity:1}
.reveal.instant,.reveal.instant .chips li,.reveal.instant .meter-fill{transition:none}
@media (prefers-reduced-motion: no-preference){
  .glow-a{animation:driftA 38s ease-in-out infinite alternate}
  .glow-b{animation:driftB 46s ease-in-out infinite alternate}
  .glow-c{animation:driftC 54s ease-in-out infinite alternate}
  .hero.enter .hello,.hero.enter .hi,.hero.enter .headline,.hero.enter .lede,.hero.enter .actions,.hero.enter .where,.hero.enter .hero-photo{animation:fadeUp .8s ease-out backwards}
  .hero.enter .hi{animation-delay:.1s}
  .hero.enter .headline{animation-delay:.2s}
  .hero.enter .lede{animation-delay:.3s}
  .hero.enter .actions{animation-delay:.4s}
  .hero.enter .where{animation-delay:.48s}
  .hero.enter .hero-photo{animation-delay:.25s}
}
@keyframes driftA{from{transform:translate(0,0) scale(1)}to{transform:translate(14vmax,10vmax) scale(1.12)}}
@keyframes driftB{from{transform:translate(0,0) scale(1.05)}to{transform:translate(-12vmax,-8vmax) scale(.95)}}
@keyframes driftC{from{transform:translate(0,0) scale(.95);opacity:.7}to{transform:translate(-14vmax,12vmax) scale(1.1);opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* editing */
.tools{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.9rem}
.tool{min-height:44px;padding:.45rem 1rem;border-radius:999px;border:1.5px dashed var(--accent);background:transparent;color:var(--accent);font:700 .95rem/1.2 var(--body);cursor:pointer}
.tool:hover{background:var(--chip)}
.tool.add{margin-top:1.25rem}
.inline-add{margin-top:1.5rem;padding:1.25rem 1.25rem .5rem;border:1.5px dashed var(--accent);border-radius:18px;background:rgba(var(--teal-rgb),.04);max-width:40rem}
.inline-add h3{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:0 0 .85rem}
.inline-add > .tools{margin:0 0 .75rem}

<script type="application/json" id="site-data">{"name":"Lekhyasri Pandavula","greeting":"Hello,","shortName":"Lekhya","headline":"Project management and business analysis, backed by an MSc in Cybersecurity and Forensic IT.","location":"Based in Portsmouth, UK, and open to relocating anywhere in the UK.","intro":"I’m an aspiring project manager and business analyst with an MSc in Cybersecurity and Forensic Information Technology from the University of Portsmouth.\n\nForensics taught me to follow the evidence, and leading a team at KFC taught me to listen to people and fix what isn’t working. I’m now looking for my first full-time role in project management, business analysis or change, especially where risk and governance matter.","photo":"","skillsets":[{"title":"Project management and business analysis","summary":"From the Google Project Management Certificate, my case studies and leading a team at KFC.","skills":"Project planning and scheduling, Scope and change control, Risk registers and RAID logs, Stakeholder management, Budget tracking and cost control, Quality and process improvement, Agile and Waterfall, Forecasting and stock ordering, Gathering feedback from customers and stakeholders, Microsoft Excel, Notion"},{"title":"Cybersecurity, risk, governance and assurance","summary":"From my MSc in Cybersecurity and Forensic Information Technology and my BSc in Forensic Science.","skills":"Information security risk, Risk assessment and mitigation, Governance and compliance, Assurance, Data protection and GDPR, Report writing, Digital forensics, Evidence handling and documentation, Security awareness"}],"languages":"English, Telugu and Hindi","contactNote":"I’m available to start straight away and happy to talk about roles in project management, business analysis or change.","email":"plekhyasri@gmail.com","phone":"","linkedin":"https://www.linkedin.com/in/lekhya-sri-pandavula-91606837la","notion":"https://curvy-celestite-d4e.notion.site/Lekhyasri-Pandavula-Portfolio-3ec8cc981ab280c581c3cd35061631de","cvLink":"","casesNote":"Scenario-based case studies I wrote to show how I handle common project challenges: scope change, risk, quality and cost control. The organisations, people and figures are fictional; the methods are standard project management practice.","projects":[{"title":"Bending the Iron Triangle","summary":"Halfway through Castlebrook Connect, a £120,000 patient booking app for 14 dental clinics, the sponsor asked for six new features worth £30,000, with no extra budget and no change to the launch date. Doing it all properly would have cost £140,000 and pushed launch back six weeks; squeezing it in would have cut user testing from four weeks to one.\n\nAs project manager, I logged a formal change request, assessed the impact with the delivery team and framed the trade-offs around what the sponsor actually needed. After two meetings we agreed on all six features, two in simplified form, for £8,000 more and three weeks later, with full user testing protected. The steering committee approved the change, and the app beat its main booking target within eight weeks of launch.","covers":"Change control, Impact assessment, Stakeholder negotiation, Power/interest grid, Steering committee","link":"https://curvy-celestite-d4e.notion.site/Bending-the-iron-triangle-3ec8cc981ab2814cbe56e26965afd9eb","cover":"","art":"triangle","doc":{"name":"Bending_the_Iron_Triangle.pdf","pdf":"assets/docs/Bending_the_Iron_Triangle.pdf","pageCount":7}},{"title":"Seeing It Coming: Risk Management","summary":"A 24-week project to move 180,000 customer records to a cloud CRM, with a fixed £250,000 budget, a deadline that could not move and personal data at stake. I facilitated a structured risk workshop that surfaced 12 risks, scored each on a 5×5 likelihood and impact matrix, and gave every one an owner, a response, an early-warning trigger and a contingency plan, all tracked weekly in a RAID log.\n\nIn week 10, two risks happened within days of each other: a full audit found errors in 30% of legacy records, and the only legacy system expert resigned. Because the triggers and plans were already in place, I took three costed options to the sponsor and resolved both without moving go-live. The project finished £11,000 under budget with no data incidents, and 91% of staff logged in during their first week.","covers":"Risk register, 5×5 risk matrix, RAID log in Excel, Escalation, Contingency management, UK GDPR","link":"https://curvy-celestite-d4e.notion.site/Seeing-It-Coming-Risk-Management-4058cc981ab282b5bf5c014cdda7a31e","cover":"","art":"risk","doc":{"name":"Seeing_It_Coming_Risk_Management.pdf","pdf":"assets/docs/Seeing_It_Coming_Risk_Management.pdf","pageCount":20}},{"title":"Raising the Bar Without Raising the Budget","summary":"On an eight-month, £480,000 fixed-budget client project delivered in two-week Scrum sprints, quality was slipping. Defects per sprint had more than doubled, rework was eating 22% of team effort, and only 78% of UAT test cases passed first time.\n\nUsing Pareto analysis and a Five Whys workshop, I traced most of the 112 defects back to unclear requirements and late testing. I then piloted five targeted process changes through a Plan-Do-Check-Act cycle, tracked with a quality dashboard and a PRINCE2-style quality register. Rework fell from 22% to 7%, the project went live on time at £466,000 of its £480,000 budget, and the client came back for a second phase.","covers":"Quality management, Pareto analysis, Five Whys, PDCA, Quality register, Quality dashboard, Scrum","link":"https://curvy-celestite-d4e.notion.site/Raising-the-Bar-Without-Raising-the-Budget-3ec8cc981ab280c38078d803894a8190","cover":"","art":"quality","doc":{"name":"Raising_the_Bar_Without_Raising_the_Budget.pdf","pdf":"assets/docs/Raising_the_Bar_Without_Raising_the_Budget.pdf","pageCount":9}},{"title":"Following the Money","summary":"Project Threshold rolled out a digital onboarding platform across four sites for Northbridge Services, against a £200,000 approved budget. I wrote the charter, broke the £170,000 cost baseline into eight work packages with a monthly spend plan, set tolerances and ran weekly tracking, with a budget tracker that followed every work package through committed, accrued, actual and forecast spend.\n\nIn Month 3, earned value showed the project 10.6% over on cost (CPI 0.90), caused by two broken charter assumptions about data quality and the HR system. I raised an exception report, took four costed options to the sponsor and negotiated a £12,000 fixed-price cap with the vendor. The project went live one week late and closed at £180,000, handing back £20,000 of unused contingency and reserve.","covers":"Project charter, WBS and cost baseline, Earned value (CPI, SPI, EAC), Budget tracking, Exception reporting, Change control","link":"","cover":"","art":"money","doc":{"name":"Following_the_Money.pdf","pdf":"assets/docs/Following_the_Money.pdf","pageCount":15}}],"portfolioNote":"My flagship project, built as a full project pack: a written case study, an executive deck, an Excel workbook with a working dashboard and a Scrum backlog. NEXORA is a fictional company and the figures are illustrative.","myProjects":[{"title":"EMEA Customer Experience & Customer Success Transformation","status":"Flagship project · 16 weeks (simulated)","summary":"NEXORA, a fictional software company, has 25,000 business customers across 12 EMEA countries, and they’re getting slow support, confusing onboarding and inconsistent service. I planned a 16-week programme to fix it: customer research and journey mapping, a HubSpot CRM workflow, a customer health score, Lean Six Sigma on complaint handling and a KPI dashboard, run with Waterfall governance and Scrum sprints.","covers":"Customer journey mapping, CRM workflow, Customer health score, Scrum backlog, DMAIC, RAID and RACI, KPI dashboard, ADKAR, Excel","link":"","art":"journey","cover":"","slug":"nexora","detail":{"kicker":"Flagship project · Simulated case study","lede":"NEXORA Technologies is a fictional company selling cloud-based business management software to 25,000 business customers in 12 countries across Europe, the Middle East and Africa. As it grew, service became inconsistent, onboarding got harder and more customers cancelled. I planned a 16-week programme to give the whole region one consistent, measurable way of looking after customers.","facts":[["Organisation","NEXORA Technologies (fictional), headquartered in London"],["Scale","850 employees, 25,000 business customers, 12 EMEA countries"],["Duration","16 weeks (simulated)"],["My role","Customer Experience & Transformation Project Lead"],["Methodology","Hybrid: Waterfall governance, Scrum delivery, Lean Six Sigma"],["Tools","HubSpot CRM, Microsoft Excel, Power BI, Jira, Miro, Microsoft Project"]],"note":"NEXORA is a fictional organisation I created for this portfolio. The customer records, metrics, costs and timelines are illustrative planning assumptions, not real results, and nothing here was deployed in a live company.","deckTitle":"The executive deck","deckText":"Fifteen slides summarising the programme for senior stakeholders. Select a slide to see it full size.","deck":[{"src":"assets/img/nexora-slide-01.webp","title":"Title slide"},{"src":"assets/img/nexora-slide-02.webp","title":"Executive summary"},{"src":"assets/img/nexora-slide-03.webp","title":"Business problem and objectives"},{"src":"assets/img/nexora-slide-04.webp","title":"Mapping the customer journey"},{"src":"assets/img/nexora-slide-05.webp","title":"Customer success model"},{"src":"assets/img/nexora-slide-06.webp","title":"CRM workflow proposal"},{"src":"assets/img/nexora-slide-07.webp","title":"Hybrid delivery approach"},{"src":"assets/img/nexora-slide-08.webp","title":"Product backlog and user stories"},{"src":"assets/img/nexora-slide-09.webp","title":"Lean Six Sigma on complaint resolution"},{"src":"assets/img/nexora-slide-10.webp","title":"Performance framework"},{"src":"assets/img/nexora-slide-11.webp","title":"The KPI dashboard"},{"src":"assets/img/nexora-slide-12.webp","title":"Governance and accountability"},{"src":"assets/img/nexora-slide-13.webp","title":"People and risk"},{"src":"assets/img/nexora-slide-14.webp","title":"16-week roadmap"},{"src":"assets/img/nexora-slide-15.webp","title":"Expected value and next steps"}],"sections":[{"id":"problem","title":"The problem","blocks":[{"t":"p","text":"As NEXORA expanded across EMEA, keeping the customer experience consistent got harder. An initial assessment found ten problems:"},{"t":"list","items":["Customer service varied from region to region","Customers waited too long for replies to their enquiries","Onboarding was complicated","Staff had limited visibility of customer interactions","Customer information was split across systems and channels","Customer dissatisfaction was rising","Retention strategies weren’t good enough","Performance reporting and customer analytics were limited","Complaints were handled and escalated inefficiently","Customer-facing departments didn’t communicate consistently"],"two":true,"ordered":false},{"t":"p","text":"Together these showed the need for one coordinated customer experience programme."}]},{"id":"scope","title":"Objectives and scope","blocks":[{"t":"label","text":"Objectives"},{"t":"list","items":["Improve customer satisfaction and service quality","Standardise customer experience processes across EMEA","Build a structured onboarding framework","Introduce a central CRM strategy","Improve complaint handling and resolution","Set up proactive ways to keep customers","Improve communication between customer-facing teams","Create measurable customer success KPIs","Improve efficiency through process improvement","Build in continuous improvement"],"two":true,"ordered":false},{"t":"cols","cols":[{"title":"In scope","items":["Customer research and feedback analysis","Customer journey mapping","Customer segmentation","Onboarding improvements","CRM implementation planning","Support workflow optimisation","Customer success strategy","Retention and churn prevention","KPI dashboard","Stakeholder engagement","Training and change management","Risk and compliance","Monitoring and evaluation"]},{"title":"Out of scope","out":true,"items":["Building a new SaaS product","Replacing the entire technology infrastructure","Actual deployment across all 12 countries","Changes to subscription pricing","Recruiting permanent regional staff"]}]}]},{"id":"research","title":"Customer research and segmentation","blocks":[{"t":"p","text":"Discovery focused on what customers expect, where service falls short and how well the current processes work."},{"t":"chips","label":"Research methods","items":["Customer satisfaction surveys","Voice of Customer analysis","Customer interviews","Complaint trend analysis","Feedback categorisation","Customer journey analysis","Internal stakeholder consultations","Competitor benchmarking"]},{"t":"table","head":["Segment","Who they are","How we engage them"],"rows":[["New customers","Recently subscribed","Structured onboarding"],["Active customers","Regular product users","Engagement and education"],["At-risk customers","Declining engagement","Proactive intervention"],["High-value customers","Strategic business accounts","Dedicated relationship management"]]},{"t":"label","text":"Personas"},{"t":"cards","items":[{"title":"The new customer","text":"Needs clear onboarding instructions, responsive support and help understanding the platform."},{"title":"The business administrator","text":"Needs reliable service, efficient complaint resolution and visibility of account activity."},{"title":"The at-risk customer","text":"Keeps running into the same service frustrations and needs proactive, personalised support."}]}]},{"id":"journey","title":"Customer journey map","blocks":[{"t":"p","text":"I mapped the whole customer lifecycle in nine stages, from first hearing about NEXORA to recommending it, and paired each pain point with an improvement, a way to measure it and an owner."},{"t":"img","src":"assets/img/nexora-journey.webp","alt":"Customer journey map table with nine stages","caption":"The journey map from my project workbook: the customer’s goal, current friction, emotion or risk, proposed improvement, success measure and owner at each stage.","w":2000,"h":1059,"key":"journey"},{"t":"label","text":"The future-state journey adds"},{"t":"list","items":["Automated onboarding communications","Personalised customer engagement","One central record of customer interactions","Consistent service standards","Structured complaint escalation","Proactive retention","Regular feedback collection"],"two":true,"ordered":false}]},{"id":"success","title":"Customer success framework","blocks":[{"t":"label","text":"Onboarding in seven steps"},{"t":"steps","items":["Welcome communication","Account activation","Product introduction","Guided platform demonstration","Customer training","Initial usage assessment","Onboarding completion confirmation"]},{"t":"label","text":"Customer health score"},{"t":"p","text":"Each account gets a score out of 100 built from four weighted indicators. Customer Success teams use it to decide which accounts need attention first."},{"t":"weights","items":[["Product engagement",30],["Support history",25],["Customer satisfaction",25],["Account activity",20]]},{"t":"bands","items":[["At risk","Below 50",50,"#F2A5B8"],["Needs attention","50 to 79",30,"#F0C987"],["Healthy","80 to 100",21,"#63CDBB"]]},{"t":"label","text":"Keeping customers"},{"t":"list","items":["Proactive customer check-ins","Renewal reminders","Customer feedback reviews","Personalised engagement campaigns","Early warning of churn","Escalation of unresolved concerns"],"two":true,"ordered":false}]},{"id":"crm","title":"CRM workflow in HubSpot","blocks":[{"t":"p","text":"A central HubSpot CRM gives every team the same view of each customer. Every enquiry follows one path:"},{"t":"flow","items":["Customer enquiry","Ticket created","Categorised","Assigned","Resolved","Customer confirms","Feedback collected","Closed"]},{"t":"img","src":"assets/img/nexora-crm.webp","alt":"CRM workflow table with eight steps","caption":"The proposed CRM workflow from my workbook, with the trigger, CRM action, owner, customer message and control at each step. It’s a design, not a live integration.","w":2000,"h":1050,"key":"crm"},{"t":"cols","cols":[{"title":"What the CRM covers","items":["Customer database","Interaction tracking","Support tickets","Customer segmentation","Communication history","Automated follow-up reminders","Feedback records","Lifecycle monitoring"]},{"title":"Implementation stages","ordered":true,"items":["Requirements gathering","System configuration planning","Customer data structure design","Workflow development","User acceptance testing","Employee training","Readiness assessment","Post-implementation monitoring"]}]}]},{"id":"delivery","title":"Hybrid delivery: Waterfall and Scrum","blocks":[{"t":"p","text":"Waterfall gives the programme its governance: approval, stage control and milestones. Agile practices handle the work that benefits from iteration and customer feedback, so the CRM and onboarding workstreams run as four two-week sprints."},{"t":"table","head":["Sprint","Focus","Deliverable"],"rows":[["Sprint 1","Requirements and customer needs","Product backlog"],["Sprint 2","CRM structure and ticket workflows","CRM prototype"],["Sprint 3","Automated communications","Workflow prototype"],["Sprint 4","Testing and refinement","Tested solution"]]},{"t":"chips","label":"Scrum artefacts and ceremonies","items":["Product backlog","Sprint backlog","User stories","Sprint planning","Daily stand-ups","Sprint reviews","Sprint retrospectives","Definition of Done"]},{"t":"story","text":"As a customer, I want to receive an automated acknowledgement when I submit a support request, so that I know my enquiry has been registered.","criteria":["An acknowledgement is generated","A unique ticket reference is provided","The customer is told the expected response time","The support team can track the request"]},{"t":"img","src":"assets/img/nexora-backlog.webp","alt":"Scrum product backlog with eight user stories","caption":"The product backlog: 8 user stories across 7 epics, 37 story points, prioritised Must, Should and Could and assigned to sprints.","w":2000,"h":1075,"key":"backlog"}]},{"id":"lss","title":"Lean Six Sigma on complaint handling","blocks":[{"t":"p","text":"I applied DMAIC to the complaint resolution process."},{"t":"cards","five":true,"items":[{"letter":"D","title":"Define","text":"Identify delays and inefficiencies in complaint handling."},{"letter":"M","title":"Measure","text":"Set baseline response and resolution times."},{"letter":"A","title":"Analyse","text":"Find the bottlenecks and their root causes."},{"letter":"I","title":"Improve","text":"Automated ticket allocation, clearer ownership and escalation procedures."},{"letter":"C","title":"Control","text":"Track performance through regular KPI reporting."}]},{"t":"img","src":"assets/img/nexora-dmaic.webp","alt":"DMAIC improvement plan table","caption":"The DMAIC plan from my workbook, with the key question, activity, evidence and decision gate for each stage.","w":2000,"h":713,"key":"dmaic"},{"t":"chips","label":"Other techniques in the toolkit","items":["Five Whys","Fishbone diagrams","Pareto analysis","SIPOC mapping","PDCA cycle","Value stream mapping"]}]},{"id":"support","title":"Support model and service quality","blocks":[{"t":"p","text":"One support operating model for the whole region, so customers get the same standard of service wherever they are."},{"t":"chips","label":"Built on","items":["Service level agreements","Complaint procedures","Escalation matrix","First contact resolution","Interaction quality assurance","Support knowledge base","Communication standards","Service performance reviews"]},{"t":"table","head":["Level","Issue","Responsible team"],"rows":[["Level 1","General enquiries","Customer Support"],["Level 2","Complex service issues","Senior Support"],["Level 3","Critical technical issues","Technical Support"],["Level 4","Strategic or major incidents","Management"]]}]},{"id":"kpis","title":"KPIs and the dashboard","blocks":[{"t":"table","head":["KPI","Illustrative baseline","Proposed target"],"num":[1,2],"rows":[["Customer satisfaction (CSAT)","68%","85%"],["Net Promoter Score (NPS)","+12","+35"],["Customer retention rate","72%","85%"],["First response time","24 hours","4 hours"],["First contact resolution","55%","80%"],["Onboarding completion","60%","90%"],["Monthly customer churn","8%","4%"]],"note":"Simulated planning assumptions and proposed targets, not verified company performance."},{"t":"img","src":"assets/img/nexora-dashboard.webp","alt":"Excel KPI dashboard with metrics, regional view and two charts","caption":"The Excel dashboard, calculated live from 120 synthetic customer records, with a regional view and charts by segment and region. Change the data and it updates.","w":2000,"h":993,"key":"dashboard"},{"t":"img","src":"assets/img/nexora-kpi.webp","alt":"KPI dictionary table","caption":"The KPI dictionary: one definition, formula, unit, direction and owner for each measure, so every region reports the same way.","w":2000,"h":910,"key":"kpi"}]},{"id":"stakeholders","title":"Stakeholders and accountability","blocks":[{"t":"chips","label":"Key stakeholders","items":["Executive leadership","Regional management","Customer Success teams","Customer Support teams","Sales and Marketing","IT and CRM administrators","Information Security","Customers","External technology providers"]},{"t":"p","text":"A power-interest grid sorts stakeholders by their influence and interest, and a RACI matrix sets out who is responsible, accountable, consulted and informed for each activity."},{"t":"img","src":"assets/img/nexora-raci.webp","alt":"RACI matrix table","caption":"The RACI matrix from my workbook.","w":2000,"h":555,"key":"raci"}]},{"id":"change","title":"Change management with ADKAR","blocks":[{"t":"p","text":"A new CRM only works if people use it, so the change plan follows the ADKAR model."},{"t":"table","head":["Stage","What happens"],"rows":[["Awareness","Explain why the transformation is needed"],["Desire","Show employees what’s in it for them"],["Knowledge","System and process training"],["Ability","Practical exercises"],["Reinforcement","Monitor adoption and keep supporting people"]]},{"t":"p","text":"Employee feedback and training assessments are built into the plan."}]},{"id":"risk","title":"Risk and data governance","blocks":[{"t":"table","head":["Risk","Potential impact","Mitigation"],"rows":[["CRM integration difficulties","Implementation delays","Early technical assessment"],["Employee resistance","Low system adoption","Training and communication"],["Inaccurate customer data","Poor customer records","Data validation"],["Data protection concerns","Compliance exposure","Privacy and security reviews"],["Budget overruns","Financial pressure","Cost monitoring"],["Regional inconsistency","Uneven service quality","Standardised processes"]]},{"t":"img","src":"assets/img/nexora-raid.webp","alt":"RAID register table","caption":"The RAID register: risks, assumptions, issues and dependencies, each with an owner, rating and status.","w":2000,"h":756,"key":"raid"},{"t":"label","text":"Data protection in the CRM design"},{"t":"list","items":["UK GDPR and the data protection rules in each region","Data minimisation","Role-based access controls","Accurate customer data","Data retention policies","Appropriate handling of customer information","Privacy and security assessments"],"two":true,"ordered":false}]},{"id":"budget","title":"Budget","blocks":[{"t":"table","head":["Budget category","Estimated cost"],"num":[1],"rows":[["CRM configuration and implementation","£12,000"],["Employee training","£5,000"],["Data migration and validation","£4,000"],["Analytics and reporting","£3,000"],["Project management resources","£8,000"],["Contingency","£3,000"]],"foot":["Total","£35,000"],"note":"Hypothetical planning estimates, not supplier quotes."},{"t":"p","text":"Resources cover project coordination, CRM administration, customer success representatives, IT support and regional stakeholders."}]},{"id":"timeline","title":"16-week timeline","blocks":[{"t":"gantt","weeks":16,"rows":[["Project initiation",1,2],["Research and discovery",3,2],["Customer journey and strategy design",5,2],["CRM planning and configuration",7,4],["Process optimisation",11,2],["Training and testing",13,2],["Evaluation and closure",15,2]]},{"t":"p","text":"Progress is tracked through milestone reviews, status reports and stakeholder meetings."},{"t":"img","src":"assets/img/nexora-gantt.webp","alt":"Gantt chart of the 16-week roadmap","caption":"The same roadmap in my workbook, with owners, dependencies and deliverables for each workstream.","w":2000,"h":557,"key":"gantt"}]},{"id":"closure","title":"Continuous improvement and closure","blocks":[{"t":"p","text":"The PDCA cycle keeps improvements going after the project ends, so customer experience isn’t treated as a one-off fix."},{"t":"cards","items":[{"letter":"P","title":"Plan","text":"Identify service improvement opportunities."},{"letter":"D","title":"Do","text":"Implement the changes."},{"letter":"C","title":"Check","text":"Evaluate performance against the KPIs."},{"letter":"A","title":"Act","text":"Standardise what worked and address remaining gaps."}]},{"t":"label","text":"Closing the project"},{"t":"list","items":["Review of project objectives","Deliverable acceptance","KPI baseline and target review","Risk and issue assessment","Lessons learned","Stakeholder feedback","Benefits realisation planning","Recommendations for future improvements"],"two":true,"ordered":false},{"t":"p","text":"Post-implementation reviews at 30, 60 and 90 days would check whether the changes are producing measurable benefits."}]},{"id":"outcomes","title":"Expected outcomes","blocks":[{"t":"cards","items":[{"title":"Higher satisfaction","text":"More consistent communication and more responsive support."},{"title":"Better retention","text":"Earlier warning of customers at risk of cancelling."},{"title":"Efficiency","text":"Less manual admin and clearer support workflows."},{"title":"Customer visibility","text":"One place for customer information and interaction history."},{"title":"Better decisions","text":"More reliable performance reporting and customer analytics."},{"title":"Regional consistency","text":"The same customer experience standards across EMEA."},{"title":"Stronger teams","text":"Better training, communication and CRM adoption."}]},{"t":"note","text":"These are the outcomes expected if the plan were implemented and adopted. No actual results are claimed."}]},{"id":"skills","title":"Skills this project covers","blocks":[{"t":"skills","groups":[["Customer experience",["Customer journey mapping","Voice of Customer analysis","Customer satisfaction","Complaint management","Service quality improvement"]],["Customer success",["Onboarding","Customer engagement","Retention","Churn prevention","Health scoring"]],["Project management",["Initiation and planning","Agile and Scrum","Stakeholder management","Governance","Risk management","Budget and resource planning"]],["Process improvement",["Lean Six Sigma","DMAIC","Root cause analysis","SIPOC","PDCA"]],["Technology and analytics",["CRM strategy","HubSpot","Microsoft Excel","Power BI","Jira","Customer analytics"]],["Change and people",["ADKAR","Employee engagement","Training and development","Communication planning","Performance monitoring"]]]}]},{"id":"reflection","title":"What I learned","blocks":[{"t":"p","text":"This project let me explore how customer experience, customer success and project management fit together in a multinational technology company. It strengthened my understanding of customer journey management, CRM strategy, stakeholder engagement, operational performance and continuous improvement."},{"t":"p","text":"The biggest lesson was that good customer experience management goes well beyond resolving individual complaints. It needs people, processes, technology and measurable business objectives working together."},{"t":"p","text":"I also saw how Agile delivery, Lean Six Sigma and structured project governance can complement each other on a complex organisational problem."},{"t":"quote","text":"Sustainable customer success comes from understanding your customers, empowering your employees and continuously improving the processes behind the customer journey."}]}]},"files":[{"label":"Full case study write-up","kind":"PDF","view":"pdf","name":"NEXORA_Case_Study_Writeup.pdf","pdf":"assets/docs/NEXORA_Case_Study_Writeup.pdf","pageCount":15},{"label":"Executive presentation","kind":"PPT","view":"deck","name":"NEXORA_Executive_Presentation.pptx"},{"label":"Project workbook","kind":"XLS","view":"sheets","name":"NEXORA_CX_Transformation_Workbook.xlsx","sheets":["dashboard","journey","crm","backlog","gantt","raid","raci","dmaic","kpi"]},{"label":"Scrum product backlog","kind":"CSV","view":"table","name":"NEXORA_Scrum_Backlog.csv","table":{"head":["ID","Epic","User story","Acceptance criteria","Priority","Sprint","Story points","Status"],"rows":[["US-01","CRM foundation","As a support agent, I want a single customer record so I can see relevant interaction history.","Record can be searched; key fields visible; access is role-based.","Must","Sprint 1","5","To Do"],["US-02","Ticket management","As a customer, I want an acknowledgement and ticket reference after submitting an enquiry.","Acknowledgement sent; unique reference created; timestamp stored.","Must","Sprint 1","3","To Do"],["US-03","Ticket management","As a team lead, I want tickets categorised by type and priority so work is routed consistently.","Categories agreed; priority rules documented; owner assigned.","Must","Sprint 2","5","To Do"],["US-04","Onboarding","As a new customer, I want a guided checklist so I can complete setup confidently.","Checklist has steps; progress can be recorded; help links included.","Must","Sprint 2","5","To Do"],["US-05","Automation","As a customer, I want updates when ticket status changes so I know what is happening.","Status trigger defined; message template approved; test passed.","Should","Sprint 3","3","To Do"],["US-06","Customer health","As a CSM, I want a health indicator so I can prioritise at-risk accounts.","Score inputs documented; thresholds tested; owner receives task.","Should","Sprint 3","8","To Do"],["US-07","Reporting","As a manager, I want a dashboard showing response and resolution trends.","Metric definitions approved; filters available; sample data reconciles.","Must","Sprint 4","5","To Do"],["US-08","Feedback","As a CX analyst, I want feedback linked to tickets so recurring issues can be identified.","Feedback captured; detractor flag works; report can be filtered.","Could","Sprint 4","3","To Do"]]}}]}],"experience":[{"role":"Team Lead","org":"KFC Portsmouth","dates":"2025 to 2026","summary":"Led the team on shift and handled forecasting and stock ordering for the restaurant.","highlightTitle":"Turning around customer satisfaction at KFC Portsmouth","highlight":"The restaurant’s customer satisfaction (OSAT) score was under 20%. I talked to customers to find out what was going wrong, gathered their feedback and focused on improving food quality, the dining area and service. Within about three months the score reached around 80%, and customers started naming me in Google reviews.","highlightSkills":"Stakeholder feedback, Root cause analysis, Continuous improvement, Team leadership","metricLabel":"Customer satisfaction (OSAT) score","metricBefore":"Under 20%","metricAfter":"Around 80%"},{"role":"Warehouse Operative","org":"Amazon","dates":"2024, and 2025 to 2026 (two fixed-term contracts)","summary":"Tracked inbound trailers and parcel volumes in the yard, processed returns (deciding whether to repack, resend or send back to the origin site) and resolved lost or mis-packed parcels."},{"role":"Production Operative","org":"Nature’s Way Foods","dates":"2024 to 2026","summary":"Chilled food production across three company sites, including quality checks on dates, seals and pack weights."},{"role":"Steward","org":"Vespasian Security","dates":"2024 to 2026","summary":"Weekend stewarding at football stadiums and events."}],"simsNote":"Virtual job simulations on Forage, with tasks based on real work at each company.","simulations":[{"title":"Digital Transformation","org":"BCG","platform":"Forage","date":"Oct 2026","summary":"Helped CoffeeCo, a coffee chain with falling sales, design, test and scale a customer engagement app as part of the DigitalBCG team.","slug":"bcg-digital-transformation","detail":{"time":"Self-paced, about 3 to 4 hours","intro":"In this simulation I joined DigitalBCG, BCG’s digital team, working with CoffeeCo, a coffee company whose same-store sales were falling. The brief was to find out how a customer engagement app could help, decide which features mattered most, test the economics with a pilot and plan how to scale it.","tasks":[["Market research","Researched apps that have improved customer engagement in the food and beverage industry, and summarised what I found in a short PowerPoint presentation.","Market research, Research synthesis, PowerPoint"],["Use case development","Brainstormed and grouped possible app features, then picked out the ones likely to make the biggest difference to CoffeeCo’s customers.","Brainstorming, Categorisation, Creative thinking"],["Impact assessment and prioritisation","Scored the shortlisted features against key criteria and ranked them, so the team knew what to build first.","Evaluation, Prioritisation"],["Economics","Looked at the results of rapid experiments and pilot runs in Excel, and judged whether the numbers supported going further.","Financial modelling,     window.addEventListener('resize', function () {
      clearTimeout(rt);
      rt = setTimeout(function () {
        if (Math.abs(window.innerWidth - W) > 1 || Math.abs(window.innerHeight - H) > 140) build();
        else { H = window.innerHeight; canvas.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
        if (reduce.matches) still();
      }, 150);
    });
    if (reduce.addEventListener) reduce.addEventListener('change', go);
  }

  
/* ---------- connect editing (owner only) ---------- */
  function connect() {
    var c = null;
    if (!c || typeof c.use !== 'function') return;
    function safe(name) { try { return Promise.resolve(c.use(name)).catch(function () { return null; }); } catch (e) { return Promise.resolve(null); } }
    Promise.all([safe('artifact'), safe('user')]).then(function (r) {
      artifactNs = r[0];
      var u = r[1];
      if (!artifactNs) return false;
      if (location.hash === '#edit') return true;
      if (!u) return false;
      var p;
      try { p = u.can('files.write'); } catch (e) { p = null; }
      return Promise.resolve(p).then(function (v) { return (v === null || v === undefined) ? u.canEdit() : v; })
        .catch(function () { try { return u.canEdit(); } catch (e) { return false; } });
    }).then(function (ok) {
      if (!ok) return;
      canWrite = true;
      var d = loadDraft();
      if (d) { state = d; dirty = true; }
      render();
    }).catch(function () {});
  }

  view = viewFor(location.hash);
  window.addEventListener('hashchange', onHash);
  render();
  startBackground();
})();
</script>
